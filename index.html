<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jentora Builder Pvt Ltd | Site Refresh</title>
  <meta name="description" content="Jentora Builder Pvt Ltd website is currently undergoing a planned refresh. We will be back soon with an elevated digital experience.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Video Element -->
  <div class="video-background-container">
    <video autoplay muted loop playsinline id="bgVideo">
      <source src="hero_video.mp4" type="video/mp4">
      </video>
    <div class="video-overlay"></div>
    <div class="ambient-glow"></div>
  </div>

  <!-- Strictly Screen-Fit Fullscreen Wrapper -->
  <div class="fullscreen-wrapper">
    
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand-title-mini">JENTORA BUILDER PVT LTD</div>
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span class="status-text">SITE REFRESH IN PROGRESS</span>
      </div>
    </header>

    <!-- Main Content Layout -->
    <main class="main-content-layout">
      
      <!-- Brand Logo Section using Direct Image Photo -->
      <div class="logo-hero-box">
        <div class="logo-container" id="logoContainer">
          <img src="hero_img.png" alt="Jentora Builder Pvt Ltd Logo" class="brand-logo-img" />
        </div>
      </div>

      <!-- Hero Announcement Text -->
      <div class="text-hero-box">
        <h1 class="main-heading">
          Refinement in Progress
        </h1>

        <p class="sub-description">
          We thank you for your patronage. We are refreshing our site. <span class="highlight-text">Will be back soon.</span> We value your business.
        </p>

        <!-- Email Contact Section -->
        <div class="contact-card">
          <div class="contact-label">Please send in your request to</div>
          <div class="email-display-group">
            <a href="mailto:info@jentora.co.in" class="email-link" id="emailLink">
              <i class="fa-solid fa-envelope-open-text"></i>
              <span>info@jentora.co.in</span>
            </a>
            <button class="copy-btn" id="copyBtn" title="Copy Email Address">
              <i class="fa-regular fa-copy"></i>
              <span class="tooltip" id="copyTooltip">Copy</span>
            </button>
          </div>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; <span id="currentYear">2026</span> JENTORA BUILDER PVT LTD. All Rights Reserved.</p>
    </footer>

  </div>

  <!-- Powered By Bottom Right Badge -->
  <div class="powered-by-badge">
    <span>Powered by</span>
    <a href="https://zenelaitinfotech.com/" target="_blank"><img src="zenelaitinfotech_logo.png" alt="Zenelait Infotech Logo" class="powered-by-logo" /></a>
  </div>

  <!-- Toast Notification -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
</body>
</html>
